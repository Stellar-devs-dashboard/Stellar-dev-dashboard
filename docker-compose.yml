services:
  app:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  bridge-monitor:
    build:
      context: ./services/bridge-monitor
    ports:
      - "3099:3099"
    environment:
      - PORT=3099
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3099/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  behavior-analytics:
    build:
      context: ./services/behavior-analytics
    ports:
      - "3101:3101"
    environment:
      - NODE_ENV=development
      - PORT=3101
      - ANALYTICS_PSEUDONYM_SALT=${ANALYTICS_PSEUDONYM_SALT:-replace-in-production}
      - ANALYTICS_ADMIN_TOKEN=${ANALYTICS_ADMIN_TOKEN:-local-admin-token}
      - ANALYTICS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3101/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  app-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    environment:
      - NODE_ENV=development
    profiles: [dev]

  network-monitor:
    build:
      context: .
      dockerfile: services/network-monitor/Dockerfile
    ports:
      - "8787:8787"
    environment:
      - MONITOR_ALLOWED_ORIGIN=http://localhost:5173
      - MONITOR_API_KEY=${MONITOR_API_KEY:-}
    restart: unless-stopped
    profiles: [monitoring]

  sentiment-analysis:
    build:
      context: .
      dockerfile: services/sentiment-analysis/Dockerfile
    ports:
      - "8790:8790"
    environment:
      - SENTIMENT_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8080
      - SENTIMENT_API_KEY=${SENTIMENT_API_KEY:-}
    restart: unless-stopped
    profiles: [sentiment]

  fraud-detection:
    build:
      context: .
      dockerfile: services/fraud-detection/Dockerfile
    ports:
      - "8791:8791"
    environment:
      - FRAUD_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8080
      - FRAUD_API_KEY=${FRAUD_API_KEY:-}
    restart: unless-stopped
    profiles: [fraud]

  contract-testing:
    build:
      context: .
      dockerfile: services/contract-testing/Dockerfile
    ports:
      - "8793:8793"
    environment:
      - CONTRACT_TESTING_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8080
      - CONTRACT_TESTING_API_KEY=${CONTRACT_TESTING_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8793/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    profiles: [testing]

  devops-automation:
    build:
      context: ./services/devops-automation
    ports:
      - "3009:3009"
    environment:
      - PORT=3009
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3009/health"]
      interval: 30s
      timeout: 3s
      retries: 3

